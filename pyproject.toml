[project]
name = "lumberjack-py"
dynamic = ["version"]
description = "Structure-aware Markdown, HTML, and DOCX lumber pipeline for RAG preprocessing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "tianleG" }]
keywords = [
    "markdown",
    "html",
    "docx",
    "splitter",
    "chunking",
    "rag",
    "document-processing",
    "text-splitting",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Typing :: Typed",
]
dependencies = ["markdown-it-py[linkify,plugins]>=4.0.0", "pyyaml>=6.0"]

[project.optional-dependencies]
tokenizers = ["tiktoken>=0.9.0", "cachetools>=7.1.1", "transformers>=4.41.0"]
docx = ["python-docx>=1.1.0"]
web = [
    "fastapi>=0.115.0",
    "starlette<1.0.0",
    "uvicorn>=0.34.0",
    "python-multipart>=0.0.18",
]
all = ["lumberjack-py[tokenizers,docx,web,spreadsheets,toml,code-parsing]"]
code-parsing = [
    "tree-sitter>=0.25",
    "tree-sitter-bash>=0.25",
    "tree-sitter-c>=0.24",
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-go>=0.25",
    "tree-sitter-java>=0.23",
    "tree-sitter-javascript>=0.25",
    "tree-sitter-kotlin>=1.1",
    "tree-sitter-lua>=0.2",
    "tree-sitter-php>=0.23",
    "tree-sitter-python>=0.25",
    "tree-sitter-ruby>=0.23",
    "tree-sitter-rust>=0.24",
    "tree-sitter-swift>=0.7",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-zig>=1.1",
]
spreadsheets = [
    "openpyxl>=3.1",
]
toml = ["tomli>=2.0; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/ouyangfeng2022/lumberjack"
Documentation = "https://ouyangfeng2022.github.io/lumberjack/"
Changelog = "https://github.com/ouyangfeng2022/lumberjack/blob/main/CHANGELOG.md"
Source = "https://github.com/ouyangfeng2022/lumberjack"
Repository = "https://github.com/ouyangfeng2022/lumberjack"
Issues = "https://github.com/ouyangfeng2022/lumberjack/issues"
Security = "https://github.com/ouyangfeng2022/lumberjack/security/policy"

[project.scripts]
lumber = "lumberjack.cli:main"
lumberjack-serve = "lumberjack.web.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.15.6",
    "ty>=0.0.51",
]
test = ["pytest>=8.0.0", "httpx>=0.28.0"]
docs = ["mkdocs-material>=9.6", "mkdocstrings[python]>=0.30"]
benchmark = [
    "chonkie>=1.0",
    "docling>=2.0",
    "langchain-text-splitters>=0.3.0",
    "unstructured[md]>=0.16.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/lumberjack"]

[tool.hatch.build.targets.sdist]
exclude = ["lumberjack_webui/", "script/", "assets/"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
faulthandler_timeout = 30
