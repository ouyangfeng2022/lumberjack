services:
  lumberjack:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-0.0.0}
        COMMIT: ${COMMIT:-}
    image: ${IMAGE_NAME:-lumberjack}:${TAG:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-lumberjack}
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-9612}:9612"
    environment:
      TIKTOKEN_CACHE_DIR: /app/.cache/tiktoken
      HF_HOME: /app/.cache/huggingface
    command: ["--host", "0.0.0.0", "--port", "9612"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9612/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
